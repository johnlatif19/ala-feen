<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="على فين؟ | ALA FEEN? - لوحة التحكم" />
  <meta name="theme-color" content="#0D2B4C" />
  <title>لوحة التحكم | على فين؟ | ALA FEEN?</title>

  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="apple-touch-icon" href="/assets/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>

  <div class="app" id="app">

    <aside class="sidebar" id="sidebar" aria-label="القائمة الجانبية">

      <div class="sidebar__brand">
        <img src="/public/assets/logo.png" alt="على فين؟" class="sidebar__logo" />
        <div class="sidebar__brand-text">
          <span class="sidebar__brand-ar">على فين؟</span>
          <span class="sidebar__brand-en">ALA FEEN?</span>
        </div>
      </div>

      <nav class="sidebar__nav" id="sidebarNav">
        <button class="nav-item" data-route="overview">
          <span class="nav-item__label">الرئيسية</span>
        </button>
        <button class="nav-item" data-route="complaints">
          <span class="nav-item__label">الشكاوى والاقتراحات</span>
          <span class="nav-item__badge" data-badge="complaints" hidden>0</span>
        </button>
        <button class="nav-item" data-route="routes">
          <span class="nav-item__label">خطوط المواصلات</span>
        </button>
        <button class="nav-item" data-route="stations">
          <span class="nav-item__label">المحطات والمواقف</span>
        </button>
        <button class="nav-item" data-route="transport-types">
          <span class="nav-item__label">وسائل المواصلات</span>
        </button>
        <button class="nav-item" data-route="fares">
          <span class="nav-item__label">الأسعار</span>
        </button>
        <button class="nav-item" data-route="geo">
          <span class="nav-item__label">المناطق والمحافظات</span>
        </button>
        <button class="nav-item" data-route="users">
          <span class="nav-item__label">المستخدمون</span>
        </button>
        <button class="nav-item" data-route="stats">
          <span class="nav-item__label">الإحصائيات</span>
        </button>
        <button class="nav-item" data-route="logs">
          <span class="nav-item__label">سجل العمليات</span>
        </button>
        <button class="nav-item" data-route="settings">
          <span class="nav-item__label">الإعدادات</span>
        </button>
      </nav>

      <div class="sidebar__footer">
        <button class="sidebar__logout" id="logoutBtn" type="button">
          تسجيل الخروج
        </button>
      </div>

    </aside>

    <div class="main">

      <header class="topbar">

        <button
          class="topbar__menu"
          id="menuToggle"
          type="button"
          aria-label="فتح القائمة"
          aria-controls="sidebar"
          aria-expanded="false"
        ></button>

        <div class="topbar__search">
          <input
            type="search"
            id="globalSearch"
            class="topbar__search-input"
            placeholder="ابحث في كل شيء..."
            autocomplete="off"
            aria-label="بحث شامل"
          />
          <div class="topbar__search-results" id="searchResults" hidden></div>
        </div>

        <div class="topbar__meta">
          <span class="conn" id="connIndicator" data-state="online">
            <span class="conn__dot" aria-hidden="true"></span>
            <span class="conn__label">متصل</span>
          </span>
          <span class="sync" id="syncIndicator">
            آخر مزامنة: <span id="syncTime">الآن</span>
          </span>
          <button
            type="button"
            id="themeToggle"
            class="icon-btn"
            aria-label="تبديل الوضع الليلي"
            aria-pressed="false"
          >
            <span class="icon-btn__label">Dark</span>
          </button>
          <div class="user">
            <span class="user__name" id="userName">مسؤول</span>
            <span class="user__dot" aria-hidden="true"></span>
          </div>
        </div>

      </header>

      <main class="content" id="content" role="main"></main>

      <div class="offline-banner" id="offlineBanner" hidden>
        لا يوجد اتصال بالإنترنت، يتم استخدام آخر بيانات محفوظة.
      </div>

    </div>

  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close="modal"></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal__head">
        <h3 class="modal__title" id="modalTitle"></h3>
        <button class="modal__close" type="button" data-close="modal" aria-label="إغلاق">
          <span aria-hidden="true">&#215;</span>
        </button>
      </header>
      <div class="modal__body" id="modalBody"></div>
      <footer class="modal__foot" id="modalFoot"></footer>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <script src="/js/dashboard.js" defer></script>
</body>
</html>
